[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tempinfocli"
dynamic = ["version"]
description = "A live terminal temperature dashboard"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["temperature", "sensors", "hardware", "monitor", "cli", "terminal"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "rich>=13.0.0",
    "psutil>=5.9.0",
]

[project.scripts]
tempinfo = "tempinfocli.cli:main"

[tool.setuptools]
packages = ["tempinfocli"]

[tool.setuptools.dynamic]
version = { attr = "tempinfocli.__version__" }

[tool.pytest.ini_options]
pythonpath = ["."]
